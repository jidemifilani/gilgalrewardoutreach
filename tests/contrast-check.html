<!doctype html>
<meta charset="utf-8">
<title>Text contrast check</title>
<!--
  Walks every page in a same-origin iframe, finds each element that actually
  renders text, resolves the colour it is painted in and the background it is
  painted on, and reports the WCAG 2.1 contrast ratio.

  This exists because reading contrast off a screenshot is unreliable -- the
  bug that prompted it (dark body text on the dark call-to-action panel) was
  invisible in every screenshot taken above the fold.

  Open at /gilgalrewardoutreach/tests/contrast-check.html
  Options:  ?theme=dark      audit the dark palette instead
            ?all=1           list passes as well as failures

  Known limits: an element painted over a background image or gradient is
  reported against its own background-colour, and text over a photograph
  (the gallery hover captions) cannot be judged this way. Those are marked.
-->
<style>
  body { font: 13px/1.5 system-ui, sans-serif; margin: 18px; background: #F4F7F6; color: #13241F; }
  h1 { font-size: 17px; margin: 0 0 4px; }
  .sub { color: #6E837B; margin: 0 0 16px; }
  table { border-collapse: collapse; background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.08); width: 100%; max-width: 1100px; }
  th, td { padding: 6px 10px; border-bottom: 1px solid #e6eceb; text-align: left; vertical-align: top; }
  th { background: #EAF6F3; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
  .fail { color: #A8362A; font-weight: 700; }
  .warn { color: #8A5A0B; font-weight: 700; }
  .ok   { color: #14563F; font-weight: 700; }
  .sel  { font-family: ui-monospace, Menlo, monospace; font-size: 11px; }
  .txt  { color: #6E837B; max-width: 320px; }
  .sw   { display: inline-block; width: 11px; height: 11px; border: 1px solid rgba(0,0,0,.2); vertical-align: -1px; margin-right: 3px; border-radius: 2px; }
  iframe { position: absolute; left: -10000px; top: 0; width: 1280px; height: 1000px; border: 0; }
  #summary { font-weight: 700; margin: 14px 0; font-size: 15px; }
</style>

<h1>Text contrast check <span id="mode"></span></h1>
<p class="sub">WCAG 2.1 AA needs 4.5:1 for normal text and 3:1 for large text (24px+, or 18.7px+ bold).</p>
<p id="summary">Running…</p>

<table id="out">
  <thead>
    <tr><th>Page</th><th>Element</th><th>Text</th><th>Colour</th><th>On</th><th>Ratio</th><th>Needs</th><th></th></tr>
  </thead>
  <tbody></tbody>
</table>

<script>
(function () {
  var params = new URLSearchParams(location.search);
  /* Always force an explicit theme. Left to its own devices a headless
     browser reports prefers-color-scheme: dark, so an audit with no theme set
     silently tested only the dark palette -- which is how a dark-on-dark bug
     in the LIGHT palette got through this check the first time. */
  var theme  = params.get('theme') === 'dark' ? 'dark' : 'light';
  var showAll = params.get('all') === '1';

  document.getElementById('mode').textContent = '— ' + theme + ' theme';

  var pages = ['', 'about', 'outreaches', 'gallery', 'events', 'volunteer', 'contact',
               'stories', 'support', 'faq', 'privacy', 'terms',
               'search?q=reading', 'outreach?slug=back-to-school-osogbo'];

  var base = '/gilgalrewardoutreach/';
  var body = document.querySelector('#out tbody');
  var queue = pages.slice();
  var failures = 0, warnings = 0, checked = 0;

  /* --- colour helpers ---------------------------------------------------- */

  function parse(colour) {
    var m = String(colour).match(/rgba?\(([^)]+)\)/);
    if (!m) return null;
    var p = m[1].split(',').map(function (v) { return parseFloat(v); });
    return { r: p[0], g: p[1], b: p[2], a: p.length > 3 ? p[3] : 1 };
  }

  /* Flattens a translucent colour onto what sits behind it. */
  function over(fg, bg) {
    if (fg.a >= 1) return fg;
    return {
      r: (fg.r * fg.a) + (bg.r * (1 - fg.a)),
      g: (fg.g * fg.a) + (bg.g * (1 - fg.a)),
      b: (fg.b * fg.a) + (bg.b * (1 - fg.a)),
      a: 1
    };
  }

  function luminance(c) {
    var f = function (v) {
      v = v / 255;
      return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
    };
    return (0.2126 * f(c.r)) + (0.7152 * f(c.g)) + (0.0722 * f(c.b));
  }

  function ratio(a, b) {
    var la = luminance(a), lb = luminance(b);
    return (Math.max(la, lb) + 0.05) / (Math.min(la, lb) + 0.05);
  }

  function hex(c) {
    var h = function (v) { return ('0' + Math.round(v).toString(16)).slice(-2); };
    return '#' + h(c.r) + h(c.g) + h(c.b);
  }

  /* The first opaque background behind an element, flattening any translucent
     layers it passes through on the way up. */
  function backgroundOf(el, win) {
    var layers = [];
    var node = el;
    var overImage = false;

    while (node && node.nodeType === 1) {
      var cs = win.getComputedStyle(node);
      if (cs.backgroundImage && cs.backgroundImage !== 'none') overImage = true;

      var bg = parse(cs.backgroundColor);
      if (bg && bg.a > 0) {
        layers.push(bg);
        if (bg.a >= 1) break;
      }
      node = node.parentElement;
    }

    var result = { r: 255, g: 255, b: 255, a: 1 };
    for (var i = layers.length - 1; i >= 0; i--) result = over(layers[i], result);
    return { colour: result, overImage: overImage };
  }

  function hasOwnText(el) {
    for (var i = 0; i < el.childNodes.length; i++) {
      var n = el.childNodes[i];
      if (n.nodeType === 3 && n.nodeValue.trim().length > 1) return true;
    }
    return false;
  }

  /* --- the audit --------------------------------------------------------- */

  function audit(page, doc, win) {
    var all = doc.body.querySelectorAll('*');

    for (var i = 0; i < all.length; i++) {
      var el = all[i];
      if (!hasOwnText(el)) continue;

      var cs = win.getComputedStyle(el);
      if (cs.display === 'none' || cs.visibility === 'hidden' || parseFloat(cs.opacity) === 0) continue;

      var rect = el.getBoundingClientRect();
      if (rect.width === 0 || rect.height === 0) continue;

      // Skip the visually-hidden helper text.
      if (el.closest('.sr-only, .hp-field')) continue;

      var fg = parse(cs.color);
      if (!fg) continue;

      var bgInfo = backgroundOf(el, win);
      var fgFlat = over(fg, bgInfo.colour);
      var r = ratio(fgFlat, bgInfo.colour);

      var size = parseFloat(cs.fontSize);
      var weight = parseInt(cs.fontWeight, 10) || 400;
      var large = size >= 24 || (size >= 18.66 && weight >= 700);
      var need = large ? 3 : 4.5;

      checked++;

      var status, cls;
      if (bgInfo.overImage && r < need) { status = 'over image'; cls = 'warn'; warnings++; }
      else if (r < need) { status = 'FAIL'; cls = 'fail'; failures++; }
      else { status = 'ok'; cls = 'ok'; }

      if (status === 'ok' && !showAll) continue;

      var name = el.tagName.toLowerCase() +
        (el.className && typeof el.className === 'string'
          ? '.' + el.className.trim().split(/\s+/).slice(0, 3).join('.')
          : '');

      var row = doc.createElement ? document.createElement('tr') : null;
      row.innerHTML =
        '<td>/' + page + '</td>' +
        '<td class="sel">' + name.replace(/</g, '&lt;') + '</td>' +
        '<td class="txt">' + el.textContent.trim().slice(0, 60).replace(/</g, '&lt;') + '</td>' +
        '<td><span class="sw" style="background:' + hex(fgFlat) + '"></span>' + hex(fgFlat) + '</td>' +
        '<td><span class="sw" style="background:' + hex(bgInfo.colour) + '"></span>' + hex(bgInfo.colour) + '</td>' +
        '<td class="' + cls + '">' + r.toFixed(2) + ':1</td>' +
        '<td>' + need + ':1</td>' +
        '<td class="' + cls + '">' + status + '</td>';
      body.appendChild(row);
    }
  }

  function next() {
    var page = queue.shift();

    if (page === undefined) {
      document.getElementById('summary').innerHTML =
        checked + ' text elements checked &middot; ' +
        '<span class="' + (failures ? 'fail' : 'ok') + '">' + failures + ' failing</span> &middot; ' +
        '<span class="warn">' + warnings + ' over an image (check by eye)</span>';
      document.title = failures ? 'FAIL ' + failures : 'contrast ok';
      return;
    }

    var frame = document.createElement('iframe');
    frame.src = base + page;

    frame.onload = function () {
      try {
        var doc = frame.contentDocument;
        var win = frame.contentWindow;
        doc.documentElement.setAttribute('data-theme', theme);
        // Let the theme attribute settle before measuring.
        setTimeout(function () {
          audit(page, doc, win);
          frame.remove();
          next();
        }, 250);   // let the forced theme fully restyle before measuring
      } catch (e) {
        frame.remove();
        next();
      }
    };

    document.body.appendChild(frame);
  }

  next();
})();
</script>
